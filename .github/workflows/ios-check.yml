name: iOS check

# Builds the iOS targets and runs the iOS tests on a macOS machine,
# so you can verify the iOS code without owning a Mac.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # ":shared" is the module name taken from your resources package
      # (clueguard.shared.generated.resources). Change it if yours differs.
      - name: Compile iOS code
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Run iOS tests on the Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace --info
